[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs-18_x", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "pip install --break-system-packages --no-cache-dir -r api/requirements.txt",
  "cd web && npm install"
]

[phases.build]
cmds = [
  "cd web && npm run build"
]

[start]
cmd = "bash -c 'export LD_LIBRARY_PATH=/nix/store/*-gcc-*/lib:$LD_LIBRARY_PATH && cd api && python run.py'"


[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.virtualenv", "nodejs-18_x"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir -r api/requirements.txt",
  "cd web && npm install"
]

[phases.build]
cmds = [
  "cd web && npm run build"
]

[start]
cmd = "bash -c 'source /opt/venv/bin/activate && cd /app && python api/run.py'"

